<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran - Arkaic TopUp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1222; color: #ffffff; display: flex; min-height: 100vh; }
        
        .sidebar { width: 240px; background-color: #12182d; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid rgba(255, 255, 255, 0.05); position: fixed; height: 100vh; overflow-y: auto; z-index: 10; }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: #ffffff; margin-bottom: 30px; }
        .brand i { color: #3b82f6; font-size: 24px; }
        .nav-menu { list-style: none; }
        .nav-menu li { margin-bottom: 15px; }
        .nav-menu a { color: #8b92b0; text-decoration: none; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; transition: 0.3s; }
        .nav-menu a:hover, .nav-menu a.active { color: #3b82f6; }
        .sidebar-footer { margin-top: 30px; }
        .social-icons { display: flex; gap: 15px; margin-bottom: 15px; }
        .social-icons a { color: #8b92b0; font-size: 18px; transition: 0.3s; }
        .social-icons a:hover { color: #3b82f6; }
        .copyright { font-size: 11px; color: #585e7a; line-height: 1.4; }
        
        /* POSISI MAIN CONTENT DIBUAT PAS DI TENGAH LAYAR */
        .main-content { 
            margin-left: 240px; 
            flex: 1; 
            padding: 40px 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-detail { 
            background: #171e36; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 12px; 
            padding: 30px; 
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .card-header { font-size: 18px; font-weight: 700; color: #3b82f6; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        
        .timer-box { border: 1px dashed #ef4444; background: rgba(239, 68, 68, 0.05); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 25px; }
        .timer-title { font-size: 12px; color: #8b92b0; margin-bottom: 5px; }
        .timer-clock { font-size: 28px; font-weight: 800; color: #ef4444; letter-spacing: 2px; }

        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 14px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #8b92b0; }
        .info-value { font-weight: 600; text-align: right; }
        .status-badge { color: #f59e0b; font-weight: 700; }
        .status-badge.expired { color: #ef4444; }

        .pay-section { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .pay-title { font-size: 15px; font-weight: 700; color: #38bdf8; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .qr-box { background: white; padding: 15px; border-radius: 12px; display: inline-block; margin-bottom: 15px; }
        .qr-box img { width: 180px; height: 180px; display: block; }

        /* TAMPILAN TRANSFER GOPAY */
        .transfer-box { background: #0d1222; border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 10px; padding: 20px; margin-top: 10px; text-align: center; }
        .transfer-number { font-size: 22px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; margin: 10px 0; }
        .btn-copy { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-copy:hover { background: #1d4ed8; }

        @media (max-width: 900px) { .sidebar { width: 70px; padding: 15px 10px; } .brand span, .nav-menu span, .copyright, .sidebar-footer { display: none; } .main-content { margin-left: 70px; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="brand"><i class="fa-solid fa-gamepad"></i><span>Arkaic TopUp</span></div>
            <ul class="nav-menu">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> <span>Topup Games</span></a></li>
                <li><a href="riwayat.html"><i class="fa-solid fa-cart-shopping"></i> <span>Riwayat Pembelian</span></a></li>
                <li><a href="faq.html"><i class="fa-solid fa-circle-question"></i> <span>Pertanyaan Umum</span></a></li>
                <li><a href="terms.html"><i class="fa-solid fa-file-contract"></i> <span>Syarat & Ketentuan</span></a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <div class="social-icons">
                <a href="https://instagram.com/ryo_ich1" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://tiktok.com/@muscreslim" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
                <a href="https://wa.me/6281286283245" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="https://youtube.com/@AdhiAsep" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            </div>
            <div class="copyright">Copyright © 2026 Arkaic.<br>All Rights Reserved.</div>
        </div>
    </div>

    <div class="main-content">
        <div class="card-detail">
            <div class="card-header"><i class="fa-solid fa-receipt"></i> Detail Pembayaran</div>
            
            <div class="timer-box">
                <div class="timer-title">Selesaikan Pembayaran Dalam Waktu:</div>
                <div class="timer-clock" id="timer">00:30:00</div>
            </div>

            <div class="info-row">
                <span class="info-label">Status Pembayaran</span>
                <span class="info-value status-badge" id="payStatus">PENDING</span>
            </div>
            <div class="info-row">
                <span class="info-label">Game</span>
                <span class="info-value" id="valGame">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Item</span>
                <span class="info-value" id="valItem">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">User ID</span>
                <span class="info-value" id="valUser">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Metode Pembayaran</span>
                <span class="info-value" id="valMethod">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Total Pembayaran</span>
                <span class="info-value" id="valPrice" style="color: #38bdf8; font-size: 16px;">-</span>
            </div>

            <div class="pay-section">
                <div class="pay-title" id="methodTitle"></div>
                <div id="paymentContent"></div>
            </div>
        </div>
    </div>

    <script>
        // BACA PARAMETER URL
        const urlParams = new URLSearchParams(window.location.search);
        
        document.getElementById('valGame').innerText = urlParams.get('game') || 'Mobile Legends';
        document.getElementById('valItem').innerText = urlParams.get('item') || '-';
        document.getElementById('valUser').innerText = urlParams.get('user') || '-';
        
        const method = urlParams.get('method') || 'DANA';
        document.getElementById('valMethod').innerText = method;
        document.getElementById('valPrice').innerText = urlParams.get('price') || 'Rp 0';

        // LOGIKA IF-ELSE PEMISAHAN INSTRUKSI PEMBAYARAN
        const titleContainer = document.getElementById('methodTitle');
        const contentContainer = document.getElementById('paymentContent');

        if (method.toLowerCase() === 'gopay') {
            titleContainer.innerHTML = `<i class="fa-solid fa-mobile-screen-button"></i> Transfer Nomor GoPay`;
            contentContainer.innerHTML = `
                <div class="transfer-box">
                    <p style="font-size: 13px; color: #8b92b0;">Silakan transfer sesuai nominal ke nomor berikut:</p>
                    <div class="transfer-number" id="gopayNum">089663663010</div>
                    <button class="btn-copy" onclick="copyNumber()"><i class="fa-regular fa-copy"></i> Salin Nomor</button>
                </div>
            `;
        } else {
            // DEFAULT (DANA QR CODE)
            titleContainer.innerHTML = `<i class="fa-solid fa-qrcode"></i> Scan QR Code DANA`;
            contentContainer.innerHTML = `
                <div class="qr-box">
                    <img src="assets/qris_dana.png" alt="QR Code DANA">
                </div>
            `;
        }

        function copyNumber() {
            const num = document.getElementById('gopayNum').innerText;
            navigator.clipboard.writeText(num).then(() => {
                alert('Nomor GoPay berhasil disalin!');
            });
        }

        // TIMER MUNDUR 30 MENIT
        let totalSeconds = 30 * 60;
        const timerElement = document.getElementById('timer');
        const statusElement = document.getElementById('payStatus');

        const countdownInterval = setInterval(() => {
            if (totalSeconds <= 0) {
                clearInterval(countdownInterval);
                timerElement.innerText = "00:00:00";
                statusElement.innerText = "EXPIRED";
                statusElement.classList.add('expired');
                alert("Waktu pembayaran telah habis!");
                return;
            }

            totalSeconds--;

            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            timerElement.innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }, 1000);
    </script>
</body>
</html>
