<?php
// Wajib ada di baris paling atas agar variabel $conn terbaca
require_once 'koneksi.php';

if ($_SERVER['REQUEST_METHOD'] === 'POST') {
    // 1. Ambil data dari form secara aman
    $game           = mysqli_real_escape_string($conn, $_POST['game'] ?? '');
    $user_id        = mysqli_real_escape_string($conn, $_POST['user_id'] ?? '');
    $zone_id        = mysqli_real_escape_string($conn, $_POST['zone_id'] ?? '-');
    $payment_method = mysqli_real_escape_string($conn, $_POST['payment_method'] ?? '');
    
    // 2. Olah data item dan harga (dikirim dari form radio button)
    $item_raw  = $_POST['item'] ?? '|0';
    $item_data = explode('|', $item_raw);
    
    $item_name = mysqli_real_escape_string($conn, $item_data[0]);
    $price     = (int)($item_data[1] ?? 0);

    // 3. Buat Kode Invoice Unik
    $order_id = "INV-" . date("YmdHis") . rand(100, 999);

    // 4. Simpan ke Database
    $full_item_name = $game . " - " . $item_name;
    
    $query = "INSERT INTO transactions (order_id, user_id, zone_id, item_name, price, payment_method, status) 
              VALUES ('$order_id', '$user_id', '$zone_id', '$full_item_name', '$price', '$payment_method', 'PENDING')";

    if (mysqli_query($conn, $query)) {
        // Berhasil -> Langsung pindah ke halaman instruksi bayar
        header("Location: bayar.php?order_id=" . $order_id);
        exit();
    } else {
        echo "Gagal memproses transaksi: " . mysqli_error($conn);
    }
} else {
    header("Location: index.php");
    exit();
}
?>
