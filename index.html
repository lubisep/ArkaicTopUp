<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkaic - Top Up Game Online</title>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1222;
            color: #ffffff;
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* --- BACKGROUND VIDEO & OVERLAY --- */
        .video-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .video-bg-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 18, 34, 0.75);
            z-index: -1;
        }

        /* --- SIDEBAR KIRI --- */
        .sidebar {
            width: 240px;
            background-color: #12182d;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .brand i {
            color: #3b82f6;
            font-size: 24px;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 15px;
        }

        .nav-menu a {
            color: #8b92b0;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .nav-menu a:hover, .nav-menu a.active {
            color: #3b82f6;
        }

        .sidebar-footer {
            margin-top: 30px;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .social-icons a {
            color: #8b92b0;
            font-size: 18px;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: #3b82f6;
        }

        .copyright {
            font-size: 11px;
            color: #585e7a;
            line-height: 1.4;
        }

        /* --- KONTEN UTAMA --- */
        .main-content {
            margin-left: 240px;
            flex: 1;
            padding: 30px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i {
            color: #3b82f6;
        }

        /* --- BANNER ARKAIC --- */
        .banner-container {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, #1b2853 0%, #151d3b 100%);
            border-radius: 16px;
            border: 2px solid #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .banner-logo-img {
            max-width: 80%;
            max-height: 120px;
            width: auto;
            object-fit: contain;
        }

        /* --- GRID GAME CARDS --- */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: #171e36;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            position: relative;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #3b82f6;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
        }

        .game-img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .game-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 8px;
            background: linear-gradient(to top, rgba(13, 18, 34, 0.95), transparent);
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        /* RESPONSIVE UNTUK LAYAR KECIL */
        @media (max-width: 900px) {
            .sidebar { width: 70px; padding: 15px 10px; }
            .brand span, .nav-menu span, .copyright, .sidebar-footer { display: none; }
            .main-content { margin-left: 70px; }
        }
    </style>
</head>
<body>

    <!-- VIDEO BACKGROUND & OVERLAY GELAP -->
    <div class="video-bg-container">
        <video autoplay loop muted playsinline>
            <source src="assets/bg-video.mp4" type="video/mp4">
        </video>
    </div>
    <div class="video-overlay"></div>

    <!-- SIDEBAR KIRI -->
    <div class="sidebar">
        <div>
            <div class="brand">
                <i class="fa-solid fa-gamepad"></i>
                <span>Arkaic TopUp</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="active"><i class="fa-solid fa-house"></i> <span>Topup Games</span></a></li>
                <li><a href="riwayat.html"><i class="fa-solid fa-cart-shopping"></i> <span>Riwayat Pembelian</span></a></li>
                <li><a href="faq.html"><i class="fa-solid fa-circle-question"></i> <span>Pertanyaan Umum</span></a></li>
                <li><a href="terms.html"><i class="fa-solid fa-file-contract"></i> <span>Syarat & Ketentuan</span></a></li>
                <li><a href="admin.html"><i class="fa-solid fa-user-gear"></i> <span>Admin Panel</span></a></li>
            </ul>
        </div>

        <div class="sidebar-footer">
            <div class="social-icons">
                <a href="https://instagram.com/ryo_ich1" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://tiktok.com/@muscreslim" target="_blank" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                <a href="https://wa.me/6281286283245" target="_blank" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="https://youtube.com/@AdhiAsep" target="_blank" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
            </div>
            <div class="copyright">
                Copyright © 2026 Arkaic.<br>All Rights Reserved.
            </div>
        </div>
    </div>

    <!-- KONTEN UTAMA -->
    <div class="main-content">
        <!-- BANNER LOGO -->
        <div class="banner-container">
            <img src="assets/logo.png" alt="Arkaic Banner" class="banner-logo-img">
        </div>

        <!-- JUDUL SECTION -->
        <div class="page-header">
            <h2 class="page-title"><i class="fa-solid fa-gamepad"></i> Pilih Game Favorit Kamu</h2>
        </div>

        <!-- DAFTAR GAME -->
        <div class="games-grid" id="gamesGrid">
            <a href="game.html?slug=mobile-legends" class="game-card">
                <img src="assets/ml.jpg" alt="Mobile Legends" class="game-img">
                <div class="game-title">Mobile Legends</div>
            </a>
            <a href="game.html?slug=free-fire" class="game-card">
                <img src="assets/ff.jpg" alt="Free Fire" class="game-img">
                <div class="game-title">Free Fire</div>
            </a>
            <a href="game.html?slug=pubg-mobile" class="game-card">
                <img src="assets/pubg.jpg" alt="PUBG Mobile" class="game-img">
                <div class="game-title">PUBG Mobile</div>
            </a>
            <a href="game.html?slug=roblox" class="game-card">
                <img src="assets/roblox.png" alt="Roblox" class="game-img">
                <div class="game-title">Roblox</div>
            </a>
        </div>
    </div>

    <!-- SCRIPT UNTUK LOAD GAME DARIN ADMIN PANEL -->
    <script>
        function loadAdminGames() {
            const gamesGrid = document.getElementById('gamesGrid');
            const customGames = JSON.parse(localStorage.getItem('customGames')) || [];

            customGames.forEach(game => {
                const gameCard = document.createElement('a');
                gameCard.href = game.link;
                gameCard.className = 'game-card';
                gameCard.innerHTML = `
                    <img src="${game.image}" alt="${game.name}" class="game-img">
                    <div class="game-title">${game.name}</div>
                `;
                gamesGrid.appendChild(gameCard);
            });
        }

        // Panggil fungsi saat halaman selesai dimuat
        document.addEventListener('DOMContentLoaded', loadAdminGames);
    </script>
</body>
</html>
